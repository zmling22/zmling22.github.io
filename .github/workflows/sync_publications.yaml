name: Sync Publications

on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday, 16:17 Asia/Shanghai (3–4 days between runs).
    - cron: '17 8 * * 1,4'

permissions:
  contents: read

concurrency:
  group: publication-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Restore Scholar details and PDF cache
        uses: actions/cache@v4
        with:
          path: |
            google_scholar_crawler/results/gs_data.json
            .local/publication-pdfs
          key: publications-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: publications-v1-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Check sync and figure extraction
        run: |
          python google_scholar_crawler/main.py --help
          python -m unittest discover -s tests -v
      - name: Fetch publications and extract missing PDF figures
        run: |
          for attempt in 1 2; do
            if python scripts/sync_publications.py --timeout 300 --image-timeout 240; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Scholar sync failed; retrying once in 30 seconds."
              sleep 30
            fi
          done
          exit 1
      - name: Save validated publications
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json _data/publication_images.json images/publications/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update publications and PDF figures"
            # Incorporate unrelated homepage edits without overwriting them.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report sync result
        if: always()
        run: python scripts/report_publication_sync.py
      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-sync-${{ github.run_id }}
          path: |
            .local/scholar-sync-status.json
            .local/publication-image-status.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    # GITHUB_TOKEN commits do not trigger push workflows; deploy explicitly.
    uses: ./.github/workflows/pages.yaml
